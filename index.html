<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>Pentrebach House Darts</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PHD Darts">
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <button class="btn-back" id="btn-back" aria-label="Go back">&#8592;</button>
    <img class="header-logo-phd" src="phd-logo.png" alt="Pentrebach House Darts" onerror="this.style.display='none'"/>
    <div class="header-title">PHD</div>
  </div>
  <div class="header-right">
    <span class="powered-by-label">Powered by</span>
    <img class="header-logo-cynffon" src="cynffon-logo.png" alt="Cynffon" onerror="this.style.display='none'"/>
  </div>
</header>

<div class="screens">

<section class="screen" id="screen-home" style="display:flex">
<div class="home-hero">
    <img class="home-hero-logo" src="phd-logo.png" alt="PHD Logo" onerror="this.style.display='none'"/>
    <div class="home-hero-name">Pentrebach<br>House Darts</div>
    <div class="home-hero-tagline">EST. 2025</div>
  </div>
  <div class="home-grid">
    <button class="btn btn-primary btn-mega" data-target="screen-match-setup">
      <span class="btn-icon">&#127919;</span>Start Match<span class="btn-sub">Begin a new fixture</span>
    </button>
    <button class="btn btn-secondary btn-mega" data-target="screen-training">
      <span class="btn-icon">&#127985;</span>Training<span class="btn-sub">Practice modes</span>
    </button>
    <button class="btn btn-secondary btn-mega" data-target="screen-players">
      <span class="btn-icon">&#128101;</span>Players<span class="btn-sub">Manage roster</span>
    </button>
    <button class="btn btn-secondary btn-mega" data-target="screen-history">
      <span class="btn-icon">&#128203;</span>Match History<span class="btn-sub">Past results</span>
    </button>
  </div>
</section>

<section class="screen" id="screen-match-setup" style="display:none">
</section>

<section class="screen" id="screen-game-setup" style="display:none">
</section>

<section class="screen" id="screen-scoring" style="display:none">
</section>

<section class="screen" id="screen-stats" style="display:none">
  <div class="stats-winner-banner">
    <div class="stats-winner-label">Winner</div>
    <div class="stats-winner-name">Aaron Davies</div>
    <div class="stats-winner-sub">Pentrebach A &middot; Checkout: D16</div>
  </div>
  <div class="checkout-highlight">
    <div>
      <div class="checkout-label">WINNING CHECKOUT</div>
      <div class="checkout-value">32 &#8594; D16</div>
    </div>
    <div style="font-size:2rem;">&#127919;</div>
  </div>
  <div class="card">
    <div class="card-title">Game Statistics</div>
    <table class="stats-table">
      <thead>
        <tr><th style="text-align:left;">Stat</th><th>Home</th><th>Away</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="flex-row">
    <div class="card text-center" style="flex:1;"><div class="card-title">Leg score</div>
      <div style="font-size:1.8rem;color:var(--accent);">0 &ndash; 0</div></div>
    <div class="card text-center" style="flex:1;"><div class="card-title">Games</div>
      <div style="font-size:1.8rem;color:var(--accent);">0 &ndash; 0</div></div>
  </div>
  <div class="flex-row">
    <button class="btn btn-primary"   id="btn-next-game">Next Game &#8594;</button>
    <button class="btn btn-secondary" id="btn-finish-match">Finish Match</button>
  </div>
</section>

<section class="screen" id="screen-players" style="display:none">
  <div>
    <div class="page-title">Players</div>
    <div class="page-subtitle">Manage your roster</div>
  </div>
  <input class="form-input" id="player-search" type="search"
         placeholder="Search players&hellip;" style="font-family:Arial,sans-serif;font-weight:400;"/>
  <div class="player-list" id="player-list"></div>
  <button class="btn btn-primary" id="btn-add-player" style="margin-top:auto;">+ Add Player</button>
</section>

<section class="screen" id="screen-history" style="display:none">
  <div>
    <div class="page-title">Match History</div>
    <div class="page-subtitle">Past fixtures &amp; results</div>
  </div>
  <button class="btn btn-danger btn-sm" id="btn-clear-history"
          style="align-self:flex-end;width:auto;min-height:40px;">&#128465;&nbsp;Clear All</button>
  <div class="history-list" id="match-history-list"></div>
</section>

<section class="screen" id="screen-training" style="display:none">
  <!-- content rendered dynamically by renderTrainingSetup() -->
</section>

<section class="screen" id="screen-training-stats" style="display:none">
  <!-- content rendered dynamically by renderTrainingStats() -->
</section>

</div><!-- /screens -->

<div class="modal-overlay" id="modal-player">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-player-title">Add Player</div>
    <div class="form-group">
      <label class="form-label" for="modal-player-name">Name</label>
      <input class="form-input" id="modal-player-name" type="text" placeholder="Full name" maxlength="32"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="modal-player-nickname">Nickname (optional)</label>
      <input class="form-input" id="modal-player-nickname" type="text" placeholder="e.g. The Arrow" maxlength="20"/>
    </div>
    <div class="flex-row">
      <button class="btn btn-primary"   id="btn-save-player">Save Player</button>
      <button class="btn btn-secondary" id="btn-cancel-player">Cancel</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
